<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Advanced Hostile CSS fixture</title>
    <style>
      /* biome-ignore-all lint/complexity/noImportantStyles: Hostile CSS test fixture intentionally uses important rules */
      /* Advanced hostile reset testing flex/grid, transforms, clip-paths, and aggressive inheritance */
      *,
      *::before,
      *::after {
        all: unset !important;
        box-sizing: content-box !important;
        color: transparent !important;
        font-family: fantasy !important;
        font-size: 0px !important;
        line-height: 0 !important;
        margin: -999px !important;
        padding: 0 !important;
        border: 10px solid lime !important;
        transform: scale(0.01) !important;
        filter: blur(100px) !important;
        clip-path: polygon(0 0, 0 0, 0 0) !important;
        pointer-events: none !important;
        user-select: none !important;
      }

      body {
        display: flex !important;
        flex-direction: column-reverse !important;
        background: #000000 !important;
        overflow: hidden !important;
      }

      dialog {
        display: none !important;
        position: static !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -99999 !important;
      }

      button,
      input,
      select,
      textarea {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #filika-feedback-root {
        all: initial;
      }
    </style>
  </head>
  <body>
    <h1>Advanced Hostile Page</h1>
    <header class="site-header">
      <span class="brand">Filika</span>
      <nav class="site-nav" aria-label="Primary navigation">
        <button id="nav-demo" type="button">Demo</button>
        <button id="nav-inbox" type="button">Inbox</button>
      </nav>
      <div class="header-actions">
        <p id="webmcp-status" class="mono" role="status">Checking WebMCP support...</p>
      </div>
    </header>
    <main id="app-content"></main>
    <div id="filika-feedback-root"></div>
    <script src="/sdk/filika.development.js" id="filika-sdk"
      data-project-key="filika-demo"
      data-endpoint="http://localhost:8787/api/v1/feedback"
      data-route-label="Sample task"
      data-application-release="demo-2026.08"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
