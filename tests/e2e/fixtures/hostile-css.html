<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostile CSS fixture</title>
    <style>
      /* biome-ignore-all lint/complexity/noImportantStyles: Hostile CSS test fixture intentionally uses important rules */
      /* Aggressive global styles designed to break poorly isolated components */
      * {
        all: unset !important;
        box-sizing: content-box !important;
        color: red !important;
        font-family: monospace !important;
        font-size: 0px !important;
        letter-spacing: 50px !important;
        line-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      body {
        background: #000000 !important;
        overflow: hidden !important;
      }

      dialog {
        display: none !important;
        position: static !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      button,
      input,
      select,
      textarea {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        border: 20px solid purple !important;
      }

      #filika-feedback-root {
        all: initial;
      }
    </style>
  </head>
  <body>
    <h1>Hostile host page</h1>
    <p>This host page applies aggressive global CSS rules with !important overrides.</p>
    <header class="site-header">
      <span class="brand">Filika</span>
      <nav class="site-nav" aria-label="Primary navigation">
        <button id="nav-demo" type="button">Demo</button>
        <button id="nav-inbox" type="button">Inbox</button>
      </nav>
      <div class="header-actions">
        <p id="webmcp-status" class="mono" role="status">Checking WebMCP support...</p>
      </div>
    </header>
    <main id="app-content"></main>
    <div id="filika-feedback-root"></div>
    <script src="/sdk/filika.development.js" id="filika-sdk"
      data-project-key="filika-demo"
      data-endpoint="http://localhost:4173/api/v1/feedback"
      data-route-label="Sample task"
      data-application-release="demo-2026.08"></script>
    <script type="module" src="/index.js"></script>
  </body>
</html>
