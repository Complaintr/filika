<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>SDK core smoke fixture</title></head>
  <body>
    <h1>SDK core smoke fixture</h1>
    <p>Synthetic review UI and in-memory fetch stub. Uses real WebMCP when available, otherwise a test double. No collector requests leave this page.</p>
    <button id="invoke" type="button">Invoke tool</button>
    <button id="manual" type="button">Open manual review</button>
    <button id="reload" type="button">Reload SDK</button>
    <button id="dispose" type="button">Dispose SDK</button>
    <label><input id="lost" type="checkbox">Simulate lost response</label>
    <pre id="state" aria-live="polite">Loading</pre>
    <dialog id="review" aria-labelledby="review-title">
      <h2 id="review-title">Synthetic review adapter</h2>
      <label>Report title <input id="title" value="Manual report"></label>
      <label>Description <textarea id="description">Synthetic test feedback.</textarea></label>
      <pre id="context"></pre>
      <button id="confirm" type="button">Confirm test report</button>
      <button id="retry" type="button" hidden>Retry same report</button>
      <button id="cancel" type="button">Cancel review</button>
    </dialog>
    <script>
      let registeredTool;
      let requests = 0;
      let lastResult = null;
      let lastBody = null;
      let activeReview = null;
      let firstSdk = null;
      const receipts = new Map();
      const byId = (id) => document.getElementById(id);
      const nativeContext = document.modelContext;
      const refresh = async () => {
        const tools = nativeContext ? await nativeContext.getTools() : [];
        const toolCount = nativeContext ? tools.filter((tool) => tool.name === "filika_submit_feedback").length : Number(Boolean(registeredTool));
        firstSdk ??= window.Filika;
        byId("state").textContent = JSON.stringify({
          status: window.Filika?.status,
          api: nativeContext ? "native" : "test-double",
          registeredTools: toolCount,
          sameInstance: firstSdk === window.Filika,
          requests,
          lastResult,
          lastBody,
        }, null, 2);
      };
      if (!nativeContext) Object.defineProperty(document, "modelContext", { value: {
        async registerTool(tool, options) {
          registeredTool = tool;
          options.signal.addEventListener("abort", () => { registeredTool = null; refresh(); }, { once: true });
        },
      } });
      window.fetch = async (url, init) => {
        if (url !== "https://collector.example/api/v1/feedback") throw new Error("Unexpected endpoint");
        requests++;
        lastBody = JSON.parse(init.body);
        if (init.credentials !== "omit" || init.headers["Idempotency-Key"] !== lastBody.eventId) throw new Error("Unsafe request");
        const previous = receipts.get(lastBody.eventId);
        const receipt = previous ?? { schemaVersion: 1, eventId: lastBody.eventId, feedbackId: crypto.randomUUID(), receivedAt: new Date().toISOString(), duplicate: false };
        receipts.set(lastBody.eventId, receipt);
        if (byId("lost").checked) {
          byId("lost").checked = false;
          throw new TypeError("Synthetic lost response");
        }
        return new Response(JSON.stringify({ ...receipt, duplicate: Boolean(previous) }), { status: previous ? 200 : 201, headers: { "Content-Type": "application/json" } });
      };
      document.addEventListener("filika:review", (event) => {
        event.preventDefault();
        activeReview = event.detail;
        const request = activeReview.request;
        byId("title").value = request.draft?.title ?? "Manual report";
        byId("description").value = request.draft?.description ?? "Synthetic test feedback.";
        byId("context").textContent = JSON.stringify({ context: request.context, retry: request.retry }, null, 2);
        byId("retry").hidden = !request.retry;
        byId("review").showModal();
        request.signal.addEventListener("abort", () => { byId("review").close(); activeReview = null; }, { once: true });
      });
      byId("confirm").onclick = () => {
        activeReview.complete({ kind: "confirmed", feedback: { kind: "bug", title: byId("title").value, description: byId("description").value }, context: activeReview.request.context });
        byId("review").close();
      };
      byId("retry").onclick = () => { activeReview.complete({ kind: "retry" }); byId("review").close(); };
      byId("cancel").onclick = () => { activeReview.complete({ kind: "cancelled" }); byId("review").close(); };
      byId("review").addEventListener("cancel", () => { activeReview.complete({ kind: "cancelled" }); });
      byId("invoke").onclick = async () => {
        const input = { kind: "bug", title: "Save failed", description: "Synthetic save failure." };
        if (nativeContext) {
          const tools = await nativeContext.getTools();
          const tool = tools.find((entry) => entry.name === "filika_submit_feedback");
          lastResult = tool ? JSON.parse(await nativeContext.executeTool(tool, input)) : { code: "not_registered" };
        } else lastResult = registeredTool ? await registeredTool.execute(input, { signal: new AbortController().signal }) : { code: "not_registered" };
        refresh();
      };
      byId("manual").onclick = async () => { lastResult = await window.Filika.open(); refresh(); };
      byId("dispose").onclick = () => { window.Filika.dispose(); refresh(); };
      byId("reload").onclick = () => {
        const script = document.createElement("script");
        script.src = "/filika.js";
        script.dataset.projectKey = "must-not-reinitialize";
        script.onload = refresh;
        document.body.append(script);
      };
      window.addEventListener("load", refresh);
    </script>
    <script src="/filika.js" data-project-key="demo" data-endpoint="https://collector.example/api/v1/feedback" data-route-label="sdk-smoke"></script>
  </body>
</html>
