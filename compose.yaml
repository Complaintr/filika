services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: filika
      POSTGRES_PASSWORD: filika
      POSTGRES_DB: filika
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filika -d filika"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
