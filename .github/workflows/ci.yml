name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      # Preserve the required check name while allowing every real job to start
      # immediately. Each job installs from the shared Bun download cache.
      - name: Release parallel jobs
        run: echo "Dependency setup runs independently in each parallel job."

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Type-check workspaces
        run: bun run typecheck

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check formatting and lint rules
        run: bun run check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: filika_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/filika_test
        run: bun test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build workspaces
        run: bun run build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/filika_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: filika_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d filika_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up workspace
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Restore Chromium cache
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium system dependencies
        run: bunx --no-install playwright install-deps chromium
      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: bunx --no-install playwright install chromium --only-shell
      - name: Apply local database migrations
        run: bun run tests/e2e/database.ts migrate
      - name: Seed the local demo project
        run: bun run tests/e2e/database.ts seed
      - name: Run workspace browser tests
        run: bun run test:browser
      - name: Run retention cleanup
        if: always()
        run: bun run tests/e2e/database.ts cleanup
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: tests/e2e/test-results/
          retention-days: 7
